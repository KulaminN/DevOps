---
# 3.2.1. Установка Docker и Docker Compose
- name: Установка зависимостей, Git и Docker
  apt:
    name:
      - git
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: yes
  tags: install

# 3.2.2. Клонирование репозитория

- name: Клонирование репозитория DevOps с GitHub
  git:
    repo: "https://github.com/KulaminN/DevOps.git"
    dest: /opt/devops_project
    version: main
    force: yes
  tags: deploy

# 3.2.3. Запуск микросервисов

- name: Запуск контейнеров через Docker Compose
  command: docker compose up -d --build
  args:
    chdir: /opt/devops_project
  tags: start

# 3.2.4. Остановка микросервисов

- name: Остановка контейнеров через Docker Compose
  command: docker compose down
  args:
    chdir: /opt/devops_project
  tags: stop